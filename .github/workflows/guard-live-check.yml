name: Guard live check

# The real lazaretto-guard hook against the live service, every day, from a
# fresh machine with its own free key: a poisoned demo MCP server and a listed
# package must ask, a clean server and a clean package must stay silent.
# GitHub emails the repository owner when a run fails. The run labels itself
# (+ci) so the service never counts it as someone using the plugin.

on:
  push:
    paths:
      - 'plugins/lazaretto-guard/**'
      - '.github/workflows/guard-live-check.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Unit tests
        working-directory: plugins/lazaretto-guard
        run: node --test test/*.test.mjs

      - name: Against the live service
        run: node plugins/lazaretto-guard/test/live/live-check.mjs
