# Lazaretto as a user-defined command scanner in a ClawScan custom profile.
# Follows docs/scanners.md, "Profile scanner configuration".
#
# The key is declared under secretEnv so it never appears in a flag, a fixture
# or a scan artifact. A free key: curl -s -X POST https://lazaretto.dev/v1/trial
version: 1

profiles:
  review:
    scanners:
      - id: lazaretto
        # Absolute path to this file. Under the Docker sandbox (ClawScan's default),
        # mount its directory read-only: --sandbox-mount /abs/path/to/clawscan
        command: node /abs/path/to/clawscan/lazaretto-scanner.mjs {{target}}
        secretEnv:
          - LAZARETTO_API_KEY
        targets:
          - skill
        gate:
          rules:
            - id: lazaretto-malicious
              path: verdict
              equals: malicious
              action: block
            - id: lazaretto-flagged
              path: verdict
              equals: flagged
              action: warn
            # A local scan reads SKILL.md only and lists the rest here, so a
            # clean verdict on a skill with bundled scripts is not a whole-skill
            # all clear.
            - id: lazaretto-partial
              path: not_scanned[]
              exists: true
              action: warn
            # No scan result: the service was unreachable, rate limited, out of
            # credits, or misconfigured (error_kind says which). The scanner
            # exits 1 with valid JSON, which ClawScan records as completed, so
            # this rule fires and an outage is never a passing scan. Change the
            # action to block to fail closed.
            - id: lazaretto-unavailable
              path: status
              equals: error
              action: warn
